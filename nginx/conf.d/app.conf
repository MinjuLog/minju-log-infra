server {
  listen 443 ssl;
  server_name uroi.yaongmeow.com;

  client_max_body_size 50m;

  ssl_certificate     /etc/letsencrypt/live/uroi.yaongmeow.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/uroi.yaongmeow.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # ---------- app ----------
  location ^~ /minjulog-app/ {
    proxy_pass http://app:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # ---------- feed (HTTP API) ----------
  location ^~ /minjulog-feed/ {
    proxy_pass http://feed_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # ---------- feed (WebSocket) ----------
  location ^~ /minjulog-feed/ws {
    proxy_pass http://feed_upstream/ws;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 3600s;
  }

  # ---------- livekit (WebSocket + API) ----------
  location ^~ /minjulog-livekit/ {
    proxy_pass http://livekit:7880/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ---------- minio ----------
  location ^~ /minjulog-static/ {
    proxy_pass http://minio:9000/minjulog/;
    proxy_http_version 1.1;

    # presign이 host 포함이면 이게 중요
    proxy_set_header Host minio:9000;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # PUT도 통과시켜야 함 (deny 하면 업로드 막힘)
    # limit_except GET HEAD { deny all; }  <-- 이거 켜면 PUT 업로드가 죽음

    # 캐시는 GET만
    if ($request_method = GET) {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
  }
}
